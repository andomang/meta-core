# MetaSearch Nginx 리버스 프록시 설정
# 라즈베리파이 Linux-arm64 배포용
# 설치: sudo cp nginx.conf /etc/nginx/sites-available/metasearch
#        sudo ln -s /etc/nginx/sites-available/metasearch /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 최대 업로드 크기 (첨부파일용)
    client_max_body_size 50M;

    # 정적 파일 캐시
    location /wwwroot/ {
        alias /home/pi/metasearch/wwwroot/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Kestrel 리버스 프록시
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 타임아웃 (검색 AI 응답 대기)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
